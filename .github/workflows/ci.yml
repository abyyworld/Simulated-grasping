name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install headless OpenGL
        # MuJoCo needs a GL implementation to render offscreen. CI runners have
        # no GPU, so use OSMesa software rendering.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libosmesa6 libgl1 libglx-mesa0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache the Panda model
        id: assets
        uses: actions/cache@v4
        with:
          path: assets/franka_emika_panda
          # Bump this key when fetch_assets.py changes its pinned commit.
          key: menagerie-panda-da76818e

      - name: Fetch the Panda model
        if: steps.assets.outputs.cache-hit != 'true'
        run: python scripts/fetch_assets.py

      - name: Verify the install
        env:
          MUJOCO_GL: osmesa
        run: python scripts/check_install.py

      - name: Test
        env:
          MUJOCO_GL: osmesa
        run: pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src scripts tests
